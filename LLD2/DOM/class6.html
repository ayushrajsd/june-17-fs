<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selecting Elements</title>
    <style>
      .highlight {
        background-color: yellow;
        font-weight: bold;
      }

      .hidden {
        display: none;
      }

      .active {
        border: 2px solid blue;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <h1 id="main-title">Welcome to DOM Class</h1>
    <p class="intro">This is the first paragraph.</p>
    <div>
      <p class="intro highlight">This is the second paragraph.</p>
    </div>
    <button id="btn-1">Click Me</button>
    <button id="btn-2">Say Hello</button>
    <button class="action-btn">Submit</button>
    <button class="action-btn">Cancel</button>
    <ul>
      <li>1</li>
      <li>2</li>
      <li>3</li>
      <li>4</li>
      <li>5</li>
      <li>6</li>
      <li>8</li>
      <li>9</li>
      <li>10</li>
    </ul>

    <script src="./script.js"></script>
  </body>
</html>
